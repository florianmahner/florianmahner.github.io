<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Approach A: Recognizable brain silhouette, black stroke, red accent on fissure -->
  <!-- Transparent background -->

  <!-- Left hemisphere -->
  <path d="
    M 248 420
    C 200 410, 160 380, 140 340
    C 115 290, 110 250, 115 210
    C 120 170, 135 140, 160 118
    C 185 96, 215 85, 248 82
  " fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right hemisphere -->
  <path d="
    M 264 420
    C 312 410, 352 380, 372 340
    C 397 290, 402 250, 397 210
    C 392 170, 377 140, 352 118
    C 327 96, 297 85, 264 82
  " fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left hemisphere folds (sulci) -->
  <path d="M 145 260 C 170 250, 200 265, 220 248" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 158 195 C 180 185, 210 198, 235 185" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 155 325 C 180 315, 205 328, 230 318" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>

  <!-- Right hemisphere folds (sulci) -->
  <path d="M 367 260 C 342 250, 312 265, 292 248" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 354 195 C 332 185, 302 198, 277 185" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 357 325 C 332 315, 307 328, 282 318" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>

  <!-- Central fissure — red accent -->
  <line x1="256" y1="82" x2="256" y2="420" stroke="#E63946" stroke-width="14" stroke-linecap="round"/>

  <!-- Brain stem -->
  <path d="M 240 420 C 240 448, 245 465, 256 475 C 267 465, 272 448, 272 420" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
