<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Approach B: Geometric / abstract brain — two interlocking rounded shapes -->
  <!-- Transparent background -->

  <!-- Left hemisphere — black filled rounded shape -->
  <path d="
    M 240 100
    C 160 100, 80 160, 80 260
    C 80 350, 140 420, 220 430
    C 240 433, 248 425, 248 400
    L 248 120
    C 248 108, 244 100, 240 100
    Z
  " fill="#000" stroke="none"/>

  <!-- Right hemisphere — red accent outline only -->
  <path d="
    M 272 100
    C 352 100, 432 160, 432 260
    C 432 350, 372 420, 292 430
    C 272 433, 264 425, 264 400
    L 264 120
    C 264 108, 268 100, 272 100
    Z
  " fill="none" stroke="#E63946" stroke-width="16"/>

  <!-- Brain stem — shared, black -->
  <rect x="244" y="430" width="24" height="40" rx="8" fill="#000"/>
</svg>
