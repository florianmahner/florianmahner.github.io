<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Refined Brain Favicon — Top-down (dorsal) view
    Style: Swiss dualism — one hemisphere filled, one outlined
    Palette: black #000, red accent #E63946, transparent background

    Left hemisphere: solid black with white "cutout" sulci lines
    Right hemisphere: outlined with red internal fold structure
    This asymmetry mirrors the human/machine alignment research theme.
    The longitudinal fissure between them is clean negative space.
  -->

  <!-- ====== LEFT HEMISPHERE — Solid black with white fold lines ====== -->
  <path d="
    M 244 440
    C 240 430, 238 405, 236 380
    C 230 320, 215 270, 185 225
    C 155 175, 118 145, 100 115
    C 82 85, 85 60, 115 48
    C 150 35, 195 30, 244 35
    L 244 440 Z
  " fill="#000"/>

  <!-- White sulci lines carved into left hemisphere -->
  <!-- Central sulcus -->
  <path d="
    M 210 55
    C 205 100, 195 155, 200 210
    C 203 240, 210 275, 225 310
  " fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <!-- Precentral gyrus fold -->
  <path d="
    M 165 62
    C 162 100, 155 148, 160 195
    C 162 215, 168 240, 180 265
  " fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Frontal transverse -->
  <path d="
    M 115 105
    C 140 98, 165 95, 190 100
  " fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Parietal fold -->
  <path d="
    M 232 180
    C 220 195, 200 205, 175 210
  " fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Temporal curve -->
  <path d="
    M 235 320
    C 218 328, 195 330, 172 325
  " fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Occipital -->
  <path d="
    M 240 395
    C 228 388, 215 375, 208 358
  " fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>


  <!-- ====== RIGHT HEMISPHERE — Black outline with red internal folds ====== -->
  <path d="
    M 268 440
    C 272 430, 274 405, 276 380
    C 282 320, 297 270, 327 225
    C 357 175, 394 145, 412 115
    C 430 85, 427 60, 397 48
    C 362 35, 317 30, 268 35
    L 268 440 Z
  " fill="none" stroke="#000" stroke-width="14"/>

  <!-- Red sulci lines inside right hemisphere -->
  <!-- Central sulcus -->
  <path d="
    M 302 55
    C 307 100, 317 155, 312 210
    C 309 240, 302 275, 287 310
  " fill="none" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>

  <!-- Precentral fold -->
  <path d="
    M 347 62
    C 350 100, 357 148, 352 195
    C 350 215, 344 240, 332 265
  " fill="none" stroke="#E63946" stroke-width="6" stroke-linecap="round"/>

  <!-- Frontal transverse -->
  <path d="
    M 397 105
    C 372 98, 347 95, 322 100
  " fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>

  <!-- Parietal fold -->
  <path d="
    M 280 180
    C 292 195, 312 205, 337 210
  " fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>

  <!-- Temporal curve -->
  <path d="
    M 277 320
    C 294 328, 317 330, 340 325
  " fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>

  <!-- Occipital -->
  <path d="
    M 272 395
    C 284 388, 297 375, 304 358
  " fill="none" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>


  <!-- ====== LONGITUDINAL FISSURE — negative space between hemispheres ====== -->
  <!-- The gap between x=244 and x=268 IS the fissure — clean negative space -->

  <!-- ====== NEURAL NODES — accent dots at key junctions ====== -->
  <circle cx="200" cy="210" r="7" fill="#E63946"/>  <!-- Left central depth -->
  <circle cx="312" cy="210" r="7" fill="#E63946"/>  <!-- Right central depth -->
  <circle cx="256" cy="435" r="5" fill="#E63946"/>  <!-- Occipital pole convergence -->
  <circle cx="256" cy="38" r="5" fill="#E63946"/>   <!-- Frontal pole convergence -->

  <!-- ====== BRAINSTEM hint ====== -->
  <path d="
    M 244 440 C 248 458, 252 470, 256 478 C 260 470, 264 458, 268 440
  " fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
