<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Refined Brain Favicon — Lateral (side) view
    Style: Swiss stroke aesthetic matching the site's outlined section numbers
    Palette: black #000, red accent #E63946, transparent background

    Anatomically informed: frontal, parietal, occipital, temporal lobes,
    cerebellum, brainstem. Major sulci rendered as internal curves.
    The lateral (Sylvian) fissure highlighted in red — the brain's most
    distinctive landmark, and a nod to Florian's vision research.
  -->

  <!-- ====== OUTER BRAIN CONTOUR ====== -->
  <!-- Bold stroke, no fill — like the outlined section numbers on the site -->
  <path d="
    M 108 320
    C 88 280, 72 230, 78 175
    C 84 130, 108 95, 148 72
    C 188 50, 235 48, 285 52
    C 335 56, 375 72, 400 100
    C 425 128, 435 168, 430 215
    C 425 255, 408 285, 392 305
  " fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Occipital-to-cerebellum transition -->
  <path d="
    M 392 305
    C 382 318, 388 338, 398 352
    C 408 366, 405 382, 390 392
    C 372 402, 350 400, 338 388
  " fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brainstem -->
  <path d="
    M 338 388
    C 330 398, 322 420, 318 445
    C 315 460, 308 468, 298 470
  " fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>

  <!-- Under the temporal lobe back to front -->
  <path d="
    M 298 470
    C 285 468, 278 452, 275 435
    C 272 415, 268 400, 258 385
    C 238 360, 195 348, 150 340
    C 125 335, 110 330, 108 320
  " fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ====== CEREBELLUM TEXTURE ====== -->
  <!-- Fine parallel curves suggesting cerebellar folia -->
  <path d="M 355 370 C 365 362, 380 365, 388 372" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 348 382 C 358 374, 375 377, 383 384" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 345 393 C 352 387, 365 389, 372 394" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- ====== LATERAL (SYLVIAN) FISSURE — RED ACCENT ====== -->
  <!-- The most prominent sulcus, separating temporal from frontal/parietal -->
  <path d="
    M 128 305
    C 165 278, 218 262, 270 268
    C 310 272, 342 285, 365 305
  " fill="none" stroke="#E63946" stroke-width="12" stroke-linecap="round"/>

  <!-- ====== CENTRAL SULCUS ====== -->
  <!-- Divides frontal from parietal — runs top to Sylvian fissure -->
  <path d="
    M 255 62
    C 250 95, 242 140, 248 185
    C 252 215, 260 245, 270 268
  " fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/>

  <!-- ====== PRECENTRAL SULCUS ====== -->
  <!-- Parallel to central sulcus, in the frontal lobe -->
  <path d="
    M 195 72
    C 192 105, 188 150, 195 200
    C 198 225, 208 250, 218 268
  " fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- ====== SUPERIOR FRONTAL SULCUS ====== -->
  <path d="
    M 118 168
    C 140 162, 165 158, 190 160
  " fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>

  <!-- ====== POSTCENTRAL SULCUS ====== -->
  <path d="
    M 310 68
    C 308 100, 305 145, 310 195
    C 314 230, 322 258, 330 278
  " fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- ====== INTRAPARIETAL SULCUS ====== -->
  <path d="
    M 320 135
    C 348 140, 378 155, 400 178
  " fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>

  <!-- ====== SUPERIOR TEMPORAL SULCUS ====== -->
  <!-- Runs parallel below the Sylvian fissure -->
  <path d="
    M 140 335
    C 178 318, 228 305, 278 310
    C 310 315, 340 325, 362 340
  " fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- ====== PARIETO-OCCIPITAL SULCUS ====== -->
  <path d="
    M 375 88
    C 382 120, 388 165, 390 210
  " fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- ====== NEURAL ACTIVITY NODES — Red accent dots ====== -->
  <!-- At key intersections, suggesting synaptic firing -->
  <circle cx="270" cy="268" r="8" fill="#E63946"/>  <!-- Where central sulcus meets Sylvian -->
  <circle cx="195" cy="200" r="6" fill="#E63946"/>  <!-- Frontal lobe depth -->
  <circle cx="390" cy="210" r="6" fill="#E63946"/>  <!-- Parieto-occipital junction -->
</svg>
